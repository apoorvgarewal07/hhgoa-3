<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="lab-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1E232A"/>
      <stop offset="60%" stop-color="#14171C"/>
      <stop offset="100%" stop-color="#0B0D10"/>
    </radialGradient>
    <pattern id="cal-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#252A33" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Surface & Grid -->
  <rect width="400" height="400" fill="url(#lab-bg)"/>
  <rect width="400" height="400" fill="url(#cal-grid)"/>

  <!-- Dimensional Caliper Guides -->
  <line x1="50" y1="20" x2="350" y2="20" stroke="#E09F3E" stroke-width="1.5"/>
  <line x1="50" y1="14" x2="50" y2="26" stroke="#E09F3E" stroke-width="1.5"/>
  <line x1="350" y1="14" x2="350" y2="26" stroke="#E09F3E" stroke-width="1.5"/>
  <text x="200" y="16" font-family="monospace" font-size="9" fill="#E09F3E" text-anchor="middle" letter-spacing="1">CALIBRATION BASELINE // 300MM FOCAL LENGTH</text>

  <!-- Anthropometric Silhouette (Neutral Biometric Subject) -->
  <g id="silhouette-geometry">
    <!-- Torso / Shoulders -->
    <path d="M 60 380 Q 200 330 340 380 L 340 400 L 60 400 Z" fill="#1C2129" stroke="#333D4B" stroke-width="1.5"/>
    <path d="M 140 335 L 140 370 Q 200 380 260 370 L 260 335 Z" fill="#161B22" stroke="#2D3642" stroke-width="1.2"/>
    <!-- Head Contour -->
    <ellipse cx="200" cy="180" rx="72" ry="94" fill="#242B35" stroke="#4B586A" stroke-width="1.8"/>
    <path d="M 134 165 C 134 100 160 90 200 90 C 240 90 266 100 266 165 C 245 135 220 130 200 130 C 180 130 155 135 134 165 Z" fill="#181D24"/>
    
    <!-- 68-Point Landmark Matrix Visualizer -->
    <!-- Eyes -->
    <ellipse cx="172" cy="165" rx="14" ry="7" fill="#181E26" stroke="#22C55E" stroke-width="1.5"/>
    <circle cx="172" cy="165" r="3.5" fill="#22C55E"/>
    <circle cx="172" cy="165" r="1.5" fill="#FFFFFF"/>

    <ellipse cx="228" cy="165" rx="14" ry="7" fill="#181E26" stroke="#22C55E" stroke-width="1.5"/>
    <circle cx="228" cy="165" r="3.5" fill="#22C55E"/>
    <circle cx="228" cy="165" r="1.5" fill="#FFFFFF"/>

    <!-- Interpupillary line -->
    <line x1="172" y1="165" x2="228" y2="165" stroke="#22C55E" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="200" y="158" font-family="monospace" font-size="8" fill="#22C55E" text-anchor="middle">IPD: 56.0 MM</text>

    <!-- Eyebrows -->
    <path d="M 154 150 Q 172 144 190 150" stroke="#38BDF8" stroke-width="2" fill="none"/>
    <path d="M 210 150 Q 228 144 246 150" stroke="#38BDF8" stroke-width="2" fill="none"/>

    <!-- Nose Bridge & Tip -->
    <path d="M 200 160 L 198 198 L 206 202 L 194 202" stroke="#38BDF8" stroke-width="1.5" fill="none"/>

    <!-- Lips -->
    <path d="M 178 232 Q 200 225 222 232 Q 200 244 178 232 Z" fill="#181E26" stroke="#E09F3E" stroke-width="1.5"/>
    <line x1="182" y1="232" x2="218" y2="232" stroke="#E09F3E" stroke-width="1.2"/>

    <!-- Chin Landmark Arc -->
    <path d="M 160 250 Q 200 278 240 250" stroke="#64748B" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/>
  </g>

  <!-- Outer Bounding Reticle -->
  <rect x="90" y="70" width="220" height="240" fill="none" stroke="#BA181B" stroke-width="1.5" stroke-dasharray="10 5"/>
  <!-- Reticle Corner Ticks -->
  <path d="M 85 85 L 85 65 L 105 65" fill="none" stroke="#BA181B" stroke-width="2.5"/>
  <path d="M 295 65 L 315 65 L 315 85" fill="none" stroke="#BA181B" stroke-width="2.5"/>
  <path d="M 85 295 L 85 315 L 105 315" fill="none" stroke="#BA181B" stroke-width="2.5"/>
  <path d="M 295 315 L 315 315 L 315 295" fill="none" stroke="#BA181B" stroke-width="2.5"/>

  <!-- Viewfinder Head-Up Telemetry -->
  <text x="96" y="62" font-family="monospace" font-size="10" font-weight="bold" fill="#BA181B">SPECIMEN CALIBRATION // 128-D REFERENCE</text>
  <text x="96" y="326" font-family="monospace" font-size="9" fill="#22C55E">ROI: [70, 300, 320, 90] // CONF: 99.4%</text>
  <text x="304" y="326" font-family="monospace" font-size="9" fill="#94A3B8" text-anchor="end">DLIB RESNET50</text>
</svg>
